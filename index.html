<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Office - Business Management</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{margin:0;font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0f172a,#1e3a8a,#0f172a);min-height:100vh;overflow-x:hidden}
.bg-animate{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;overflow:hidden}
.circle{position:absolute;border-radius:50%;background:rgba(255,215,0,0.1);animation:float 10s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
.login-box{background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border-radius:20px;padding:35px;box-shadow:0 20px 60px rgba(0,0,0,0.4);max-width:380px;margin:80px auto;border:1px solid gold}
.btn-gold{background:linear-gradient(135deg,#fbbf24,#d97706);color:#000;font-weight:bold;border:none;padding:12px 20px;border-radius:10px;width:100%;cursor:pointer;transition:0.3s}
.btn-gold:hover{transform:scale(1.03);box-shadow:0 5px 20px rgba(251,191,36,0.5)}
.input{width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;margin:8px 0;box-sizing:border-box}
.dashboard{display:none;padding:20px}
.card{background:rgba(255,255,255,0.95);border-radius:15px;padding:20px;margin:15px 0;box-shadow:0 10px 30px rgba(0,0,0,0.2);animation:slideIn 0.6s}
@keyframes slideIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.notify{position:fixed;top:20px;right:20px;background:#10b981;color:white;padding:15px 25px;border-radius:12px;display:none;animation:pop 0.5s;z-index:999}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div class="bg-animate">
<div class="circle" style="width:200px;height:200px;top:10%;left:10%"></div>
<div class="circle" style="width:300px;height:300px;top:60%;left:70%;animation-delay:2s"></div>
<div class="circle" style="width:150px;height:150px;top:30%;left:80%;animation-delay:4s"></div>
</div>

<div id="loginPage">
<div class="login-box">
<h2 style="text-align:center;color:#1e3a8a">🔒 My Office Login</h2>
<input id="loginNum" class="input" placeholder="Login Number / Phone Number">
<input id="loginPass" class="input" type="password" placeholder="Password" style="display:none">
<input id="newPass" class="input" type="password" placeholder="අලුත් Password එකක් හදන්න" style="display:none">
<input id="confirmPass" class="input" type="password" placeholder="Password නැවත දාන්න" style="display:none">
<button onclick="handleLogin()" class="btn-gold" id="loginBtn">Login / ඇතුලුවන්න</button>
<p style="text-align:center;margin-top:15px;font-size:13px">පලවෙනි වතාවට නම් Phone No එක දාලා Enter කරන්න</p>
<div id="adminCreate" style="margin-top:20px;border-top:1px dashed #ccc;padding-top:15px;display:none">
<h4>Owner - අලුත් කෙනෙක් Register කිරීම</h4>
<input id="regName" class="input" placeholder="Customer ගේ නම">
<input id="regPhone" class="input" placeholder="Login Number (Phone)">
<button onclick="registerUser()" class="btn-gold" style="background:#1e3a8a;color:white">Register කරන්න</button>
</div>
</div>
</div>

<div id="dashboard" class="dashboard">
<div class="card">
<h2>Welcome <span id="userName"></span> 👋 <button onclick="logout()" style="float:right">Logout</button></h2>
<p>Login Number: <b id="userPhone"></b></p>
</div>

<div class="card">
<h3>📦 බඩු විකුණුම් / Excel Sheet</h3>
<input id="itemName" class="input" placeholder="බඩුවේ නම">
<input id="itemPrice" class="input" placeholder="මිල">
<input id="custName" class="input" placeholder="ගත් කෙනාගේ නම">
<button onclick="printAndNotify('excel')" class="btn-gold">🖨️ Print Bill + Message යවන්න</button>
</div>

<div class="card">
<h3>📒 ණය පොත - Loan Book</h3>
<input id="loanName" class="input" placeholder="ණය ගත් කෙනා">
<input id="loanAmount" class="input" placeholder="ණය මුදල">
<input id="loanDate" class="input" type="date">
<button onclick="printAndNotify('loan')" class="btn-gold" style="background:linear-gradient(135deg,#10b981,#059669);color:white">🖨️ ණය පොත Print + Message</button>
</div>
</div>

<div id="notify" class="notify">✅ Print Success! Message යැවුවා!</div>

<script>
// Security Storage
let users = JSON.parse(localStorage.getItem('myoffice_users') || '{}');

function handleLogin(){
 let phone = document.getElementById('loginNum').value.trim();
 if(!phone){alert('Phone Number දාන්න');return}
 
 // Owner login - ඔයාට
 if(phone === '0770000000'){ // මේක ඔයාගේ number එකට වෙනස් කරන්න
   document.getElementById('adminCreate').style.display='block';
   alert('Owner Mode - අලුත් අය register කරන්න');
   return;
 }

 if(!users[phone]){
   // පලවෙනි පාර - password හදන්න
   if(document.getElementById('newPass').style.display === 'none'){
     document.getElementById('newPass').style.display='block';
     document.getElementById('confirmPass').style.display='block';
     document.getElementById('loginBtn').innerText='Password හදලා Login වෙන්න';
     alert('පලවෙනි වතාවට නිසා අලුත් password එකක් හදන්න');
     return;
   } else {
     let p1 = document.getElementById('newPass').value;
     let p2 = document.getElementById('confirmPass').value;
     if(p1.length < 4){alert('Password අවම 4ක් තියෙන්න ඕන');return}
     if(p1 !== p2){alert('Passwords දෙක සමාන නෑ');return}
     // Save first time password
     users[phone] = {name: 'User '+phone, password: btoa(p1), phone: phone, created: new Date()};
     localStorage.setItem('myoffice_users', JSON.stringify(users));
     enterDashboard(phone);
   }
 } else {
   // ඊලග පාර ඉදන් password එකෙන්
   document.getElementById('loginPass').style.display='block';
   let pass = document.getElementById('loginPass').value;
   if(!pass){alert('Password දාන්න');return}
   if(btoa(pass) === users[phone].password){
     enterDashboard(phone);
   } else {
     alert('Password වැරදියි!');
   }
 }
}

function registerUser(){
 let name = document.getElementById('regName').value;
 let phone = document.getElementById('regPhone').value;
 if(!name || !phone){alert('නම සහ phone දාන්න');return}
 users[phone] = {name: name, password: null, phone: phone, created: new Date()};
 localStorage.setItem('myoffice_users', JSON.stringify(users));
 alert(name + ' Register කළා! එයාට පලවෙනි පාර login වෙලා password හදන්න කියන්න');
}

function enterDashboard(phone){
 localStorage.setItem('currentUser', phone);
 document.getElementById('loginPage').style.display='none';
 document.getElementById('dashboard').style.display='block';
 document.getElementById('userName').innerText = users[phone].name;
 document.getElementById('userPhone').innerText = phone;
}

function printAndNotify(type){
 let curPhone = localStorage.getItem('currentUser');
 let cust = document.getElementById('custName').value || document.getElementById('loanName').value || 'Customer';
 let price = document.getElementById('itemPrice').value || document.getElementById('loanAmount').value;
 
 // 1. Print
 let printWindow = window.open('', '', 'height=600,width=800');
 let content = type==='excel' ? `<h1>My Office - Bill</h1><p>Customer: ${cust}</p><p>Item: ${document.getElementById('itemName').value}</p><p>Price: ${price}</p><p>Date: ${new Date().toLocaleString()}</p><p>By: ${curPhone}</p>` : `<h1>My Office - ණය පොත</h1><p>ණය ගත් අය: ${cust}</p><p>මුදල: ${price}</p><p>දිනය: ${document.getElementById('loanDate').value}</p>`;
 printWindow.document.write(`<html><head><title>Print</title><style>body{font-family:sans-serif;padding:30px;border:2px solid gold}</style></head><body>${content}<br><button onclick="window.print()">Print කරන්න</button></body></html>`);
 printWindow.document.close();
 
 // 2. Animation + Message to login number
 let notify = document.getElementById('notify');
 notify.style.display='block';
 notify.innerHTML=`✅ ${cust} ට බඩුව දුන්නා. ${curPhone} ට Message යනවා...`;
 
 // WhatsApp Message යවන විදිය - login number එකට
 let msg = type==='excel' ? `MyOffice: ${cust} ගෙන් රු.${price} බඩු විකිනීමක් Print කළා. By ${curPhone}` : `MyOffice: ${cust} ට රු.${price} ණය පොත Print කළා.`;
 let waUrl = `https://wa.me/94${curPhone.slice(-9)}?text=${encodeURIComponent(msg)}`;
 window.open(waUrl, '_blank');
 
 setTimeout(()=>{notify.style.display='none'},4000);
}

function logout(){
 localStorage.removeItem('currentUser');
 location.reload();
}

// Auto check login
window.onload = ()=>{
 let cur = localStorage.getItem('currentUser');
 if(cur && users[cur] && users[cur].password){enterDashboard(cur)}
}
</script>
</body>
</html>
