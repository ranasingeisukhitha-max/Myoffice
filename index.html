<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Office</title>
<style>
*{box-sizing:border-box;font-family:sans-serif}
body{margin:0;background:#f1f5f9}
header{background:#0f172a;color:#fff;padding:12px 18px;display:flex;justify-content:space-between}
.tabs{display:flex;gap:6px;padding:8px;background:#e2e8f0}
.tab{padding:8px 14px;background:#fff;border:1px solid #cbd5e1;border-radius:6px}
.tab.active{background:#0f172a;color:#fff}
table{border-collapse:collapse;width:100%;background:#fff}
td,th{border:1px solid #cbd5e1;min-width:90px;height:28px;padding:2px 4px}
th{background:#f8fafc}
#doc{display:none;padding:12px}
#docBox{width:100%;height:70vh;border:1px solid #cbd5e1;background:#fff;padding:12px;border-radius:8px}
</style>
</head>
<body>
<header><b>📊 My Office</b><span style="font-size:12px">Auto Save ON ✓</span></header>
<div class="tabs">
<div class="tab active" id="t1" onclick="showSheet()">Excel Sheet</div>
<div class="tab" id="t2" onclick="showDoc()">Word Doc</div>
<button onclick="downloadCSV()">💾 Download</button>
</div>
<div id="sheetBox"></div>
<div id="doc"><div id="docBox" contenteditable="true">Type your document here...</div></div>
<script>
let R=40,C=10;
function build(){
let h='<table><tr><th></th>';
for(let c=0;c<C;c++)h+=`<th>${String.fromCharCode(65+c)}</th>`;
h+='</tr>';
for(let r=0;r<R;r++){h+=`<tr><th>${r+1}</th>`;
for(let c=0;c<C;c++){h+=`<td contenteditable data-r="${r}" data-c="${c}">${localStorage.getItem('c-'+r+'-'+c)||''}</td>`;}
h+='</tr>';}
h+='</table>';
document.getElementById('sheetBox').innerHTML=h;
document.querySelectorAll('td').forEach(td=>{
td.oninput=()=>localStorage.setItem('c-'+td.dataset.r+'-'+td.dataset.c,td.innerText)
});
}
function showSheet(){
document.getElementById('sheetBox').style.display='block';
document.getElementById('doc').style.display='none';
document.getElementById('t1').classList.add('active');
document.getElementById('t2').classList.remove('active');
}
function showDoc(){
document.getElementById('sheetBox').style.display='none';
document.getElementById('doc').style.display='block';
document.getElementById('t2').classList.add('active');
document.getElementById('t1').classList.remove('active');
}
function downloadCSV(){
let csv='';for(let r=0;r<R;r++){let row=[];for(let c=0;c<C;c++)row.push('"'+(localStorage.getItem('c-'+r+'-'+c)||'')+'"');csv+=row.join(',')+'\n';}
let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv]));a.download='MyOffice.csv';a.click();
}
let d=document.getElementById('docBox');
d.innerHTML=localStorage.getItem('doc')||d.innerHTML;
d.oninput=()=>localStorage.setItem('doc',d.innerHTML);
build();
</script>
</body>
</html>
